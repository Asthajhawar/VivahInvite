<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice" width="1080" height="1920">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d9b8"/>
      <stop offset="0.5" stop-color="#d9c19a"/>
      <stop offset="1" stop-color="#c9a96b"/>
    </linearGradient>
    <linearGradient id="archStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="1" stop-color="#e8d9b8"/>
    </linearGradient>
    <radialGradient id="archInner" cx="0.5" cy="0.42" r="0.4">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="1" stop-color="#e8d9b8"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8b8b"/>
      <stop offset="1" stop-color="#1f5e5e"/>
    </linearGradient>
  </defs>
  <!-- Background sage wall -->
  <rect width="1080" height="1920" fill="url(#sky)"/>
  <!-- Jaali patterns -->
  <g stroke="#b8a070" stroke-width="2" fill="none" opacity="0.5">
    <g transform="translate(60,200)">
      <circle r="20"/><circle r="14"/><circle cx="40" r="20"/><circle cx="40" r="14"/><circle cx="80" r="20"/>
      <circle cx="920" r="20"/><circle cx="960" r="20"/><circle cx="960" r="14"/><circle cx="1000" r="20"/>
    </g>
    <g transform="translate(60,400)">
      <circle r="20"/><circle r="14"/><circle cx="40" r="20"/><circle cx="920" r="20"/><circle cx="960" r="20"/><circle cx="960" r="14"/>
    </g>
  </g>
  <!-- Top flower vines -->
  <g transform="translate(0,40)">
    <path d="M0,0 Q200,80 540,60 Q880,80 1080,0 L1080,180 Q880,200 540,180 Q200,200 0,180 Z" fill="#7a9a6a" opacity="0.85"/>
    <g fill="#e8a0b8">
      <circle cx="120" cy="60" r="18"/><circle cx="160" cy="90" r="14"/><circle cx="220" cy="70" r="20"/>
      <circle cx="300" cy="85" r="16"/><circle cx="380" cy="75" r="18"/><circle cx="460" cy="90" r="14"/>
      <circle cx="620" cy="90" r="14"/><circle cx="700" cy="75" r="18"/><circle cx="780" cy="85" r="16"/>
      <circle cx="860" cy="70" r="20"/><circle cx="920" cy="90" r="14"/><circle cx="960" cy="60" r="18"/>
    </g>
    <g fill="#fff5f8">
      <circle cx="140" cy="100" r="10"/><circle cx="200" cy="60" r="12"/><circle cx="280" cy="70" r="10"/>
      <circle cx="340" cy="100" r="12"/><circle cx="420" cy="60" r="10"/><circle cx="500" cy="80" r="12"/>
      <circle cx="660" cy="80" r="12"/><circle cx="740" cy="60" r="10"/><circle cx="820" cy="100" r="12"/>
      <circle cx="900" cy="60" r="10"/><circle cx="980" cy="100" r="12"/>
    </g>
    <!-- Temple bells -->
    <g stroke="#c9a24b" stroke-width="1.5">
      <line x1="180" y1="120" x2="180" y2="180"/><line x1="360" y1="120" x2="360" y2="180"/>
      <line x1="540" y1="120" x2="540" y2="180"/><line x1="720" y1="120" x2="720" y2="180"/><line x1="900" y1="120" x2="900" y2="180"/>
    </g>
    <g fill="#d4af37">
      <path d="M180,180 q-12,0 -12,12 q0,18 12,30 q12,-12 12,-30 q0,-12 -12,-12 z"/>
      <path d="M360,180 q-12,0 -12,12 q0,18 12,30 q12,-12 12,-30 q0,-12 -12,-12 z"/>
      <path d="M540,180 q-12,0 -12,12 q0,18 12,30 q12,-12 12,-30 q0,-12 -12,-12 z"/>
      <path d="M720,180 q-12,0 -12,12 q0,18 12,30 q12,-12 12,-30 q0,-12 -12,-12 z"/>
      <path d="M900,180 q-12,0 -12,12 q0,18 12,30 q12,-12 12,-30 q0,-12 -12,-12 z"/>
    </g>
  </g>
  <!-- Palm trees -->
  <g transform="translate(80,500)">
    <rect x="-8" y="0" width="16" height="500" fill="#8b6f47"/>
    <g fill="#5a7a4a">
      <path d="M0,0 Q-120,-40 -160,20 Q-80,10 0,20"/>
      <path d="M0,0 Q120,-40 160,20 Q80,10 0,20"/>
      <path d="M0,0 Q-100,-80 -140,-40 Q-60,-50 0,-10"/>
      <path d="M0,0 Q100,-80 140,-40 Q60,-50 0,-10"/>
      <path d="M0,0 Q-20,-120 20,-120 Q40,-60 0,0"/>
    </g>
  </g>
  <g transform="translate(1000,500)">
    <rect x="-8" y="0" width="16" height="500" fill="#8b6f47"/>
    <g fill="#5a7a4a">
      <path d="M0,0 Q120,-40 160,20 Q80,10 0,20"/>
      <path d="M0,0 Q-120,-40 -160,20 Q-80,10 0,20"/>
      <path d="M0,0 Q100,-80 140,-40 Q60,-50 0,-10"/>
      <path d="M0,0 Q-100,-80 -140,-40 Q-60,-50 0,-10"/>
      <path d="M0,0 Q20,-120 -20,-120 Q-40,-60 0,0"/>
    </g>
  </g>
  <!-- The central arch -->
  <g transform="translate(540,500)">
    <!-- Pillars -->
    <rect x="-220" y="200" width="60" height="700" fill="url(#archStone)" stroke="#c9a24b" stroke-width="2"/>
    <rect x="160" y="200" width="60" height="700" fill="url(#archStone)" stroke="#c9a24b" stroke-width="2"/>
    <!-- Arch shape -->
    <path d="M-220,200 Q-220,-100 0,-100 Q220,-100 220,200 L160,200 Q160,-40 0,-40 Q-160,-40 -160,200 Z" fill="url(#archStone)" stroke="#c9a24b" stroke-width="3"/>
    <!-- Arch interior blank -->
    <path d="M-160,200 Q-160,-40 0,-40 Q160,-40 160,200 Z" fill="url(#archInner)"/>
    <!-- Scalloped gold trim -->
    <path d="M-160,200 Q-160,-40 0,-40 Q160,-40 160,200" fill="none" stroke="#d4af37" stroke-width="4"/>
    <g fill="none" stroke="#d4af37" stroke-width="2">
      <path d="M-160,200 q20,-20 40,0 q20,-20 40,0 q20,-20 40,0 q20,-20 40,0 q20,-20 40,0 q20,-20 40,0 q20,-20 40,0"/>
    </g>
    <!-- Filigree on pillars -->
    <g stroke="#c9a24b" stroke-width="1.5" fill="none" opacity="0.7">
      <line x1="-190" y1="250" x2="-190" y2="880"/>
      <line x1="190" y1="250" x2="190" y2="880"/>
      <circle cx="-190" cy="350" r="8"/><circle cx="-190" cy="500" r="8"/><circle cx="-190" cy="650" r="8"/><circle cx="-190" cy="800" r="8"/>
      <circle cx="190" cy="350" r="8"/><circle cx="190" cy="500" r="8"/><circle cx="190" cy="650" r="8"/><circle cx="190" cy="800" r="8"/>
    </g>
  </g>
  <!-- Water pool -->
  <rect x="0" y="1400" width="1080" height="520" fill="url(#water)"/>
  <!-- Lotus flowers -->
  <g transform="translate(200,1550)">
    <ellipse cx="0" cy="20" rx="60" ry="20" fill="#5a8a5a" opacity="0.6"/>
    <g fill="#f0c0d0">
      <ellipse cx="0" cy="0" rx="14" ry="30"/><ellipse cx="-20" cy="5" rx="12" ry="26" transform="rotate(-30 -20 5)"/>
      <ellipse cx="20" cy="5" rx="12" ry="26" transform="rotate(30 20 5)"/>
      <ellipse cx="-35" cy="15" rx="10" ry="22" transform="rotate(-60 -35 15)"/>
      <ellipse cx="35" cy="15" rx="10" ry="22" transform="rotate(60 35 15)"/>
    </g>
    <circle cx="0" cy="0" r="10" fill="#d4af37"/>
  </g>
  <g transform="translate(880,1600)">
    <ellipse cx="0" cy="20" rx="50" ry="16" fill="#5a8a5a" opacity="0.6"/>
    <g fill="#fff5f8">
      <ellipse cx="0" cy="0" rx="12" ry="26"/><ellipse cx="-18" cy="5" rx="10" ry="22" transform="rotate(-30 -18 5)"/>
      <ellipse cx="18" cy="5" rx="10" ry="22" transform="rotate(30 18 5)"/>
    </g>
    <circle cx="0" cy="0" r="8" fill="#d4af37"/>
  </g>
  <!-- Swan statues -->
  <g transform="translate(380,1500)" fill="#fff8ed" stroke="#d4af37" stroke-width="2">
    <ellipse cx="0" cy="0" rx="50" ry="30"/>
    <path d="M40,-10 Q70,-40 60,-70 Q50,-90 30,-80 Q20,-60 30,-40 Z"/>
    <circle cx="58" cy="-78" r="10"/>
    <path d="M58,-88 L65,-100 L52,-95 Z" fill="#d4af37"/>
  </g>
  <g transform="translate(700,1500)" fill="#fff8ed" stroke="#d4af37" stroke-width="2">
    <ellipse cx="0" cy="0" rx="50" ry="30"/>
    <path d="M-40,-10 Q-70,-40 -60,-70 Q-50,-90 -30,-80 Q-20,-60 -30,-40 Z"/>
    <circle cx="-58" cy="-78" r="10"/>
    <path d="M-58,-88 L-65,-100 L-52,-95 Z" fill="#d4af37"/>
  </g>
  <!-- Central fountain -->
  <g transform="translate(540,1480)">
    <ellipse cx="0" cy="40" rx="40" ry="14" fill="#d4af37"/>
    <rect x="-6" y="-20" width="12" height="60" fill="#d4af37"/>
    <circle cx="0" cy="-30" r="14" fill="#f0c080" stroke="#d4af37" stroke-width="2"/>
    <path d="M-10,-30 Q-30,-50 -10,-60 M10,-30 Q30,-50 10,-60 M0,-40 Q0,-70 0,-75" stroke="#d4af37" stroke-width="2" fill="none"/>
  </g>
</svg>
