<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" width="1600" height="2000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a4a"/>
      <stop offset="1" stop-color="#1a1a3a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="2000" fill="url(#bg)"/>
  <!-- Warm evening lanterns -->
  <g fill="#f0c040" opacity="0.8">
    <circle cx="200" cy="300" r="20"/><circle cx="1400" cy="300" r="20"/>
    <circle cx="100" cy="600" r="16"/><circle cx="1500" cy="600" r="16"/>
  </g>
  <g stroke="#d4af37" stroke-width="1" fill="none">
    <line x1="200" y1="200" x2="200" y2="280"/><line x1="1400" y1="200" x2="1400" y2="280"/>
  </g>
  <!-- Mehndi cones -->
  <g transform="translate(500,1500)">
    <path d="M0,0 L-30,120 L30,120 Z" fill="#5a3a1a"/>
    <path d="M0,0 L-30,120 L30,120 Z" fill="none" stroke="#d4af37" stroke-width="2"/>
    <ellipse cx="0" cy="120" rx="30" ry="8" fill="#3a2a1a"/>
  </g>
  <g transform="translate(1100,1500)">
    <path d="M0,0 L-30,120 L30,120 Z" fill="#5a3a1a"/>
    <path d="M0,0 L-30,120 L30,120 Z" fill="none" stroke="#d4af37" stroke-width="2"/>
    <ellipse cx="0" cy="120" rx="30" ry="8" fill="#3a2a1a"/>
  </g>
  <!-- Couple - henna being applied to hand -->
  <g transform="translate(800,1100)">
    <!-- Person applying -->
    <g transform="translate(-180,0)">
      <ellipse cx="0" cy="200" rx="120" ry="160" fill="#800020"/>
      <ellipse cx="0" cy="-20" rx="60" ry="70" fill="#f5d8a0"/>
      <ellipse cx="-15" cy="-30" rx="6" ry="8" fill="#000"/>
      <ellipse cx="15" cy="-30" rx="6" ry="8" fill="#000"/>
      <path d="M-10,0 Q0,10 10,0" stroke="#800020" stroke-width="2" fill="none"/>
      <!-- Hand with cone -->
      <ellipse cx="80" cy="100" rx="30" ry="20" fill="#f5d8a0" transform="rotate(30 80 100)"/>
      <path d="M100,90 L120,80 L130,100 L110,110 Z" fill="#5a3a1a"/>
    </g>
    <!-- Person receiving - extended hand with mehndi patterns -->
    <g transform="translate(180,0)">
      <ellipse cx="0" cy="200" rx="120" ry="160" fill="#0b3d91"/>
      <ellipse cx="0" cy="-20" rx="60" ry="70" fill="#f5d8a0"/>
      <ellipse cx="-15" cy="-30" rx="6" ry="8" fill="#000"/>
      <ellipse cx="15" cy="-30" rx="6" ry="8" fill="#000"/>
      <path d="M-10,0 Q0,10 10,0" stroke="#800020" stroke-width="2" fill="none"/>
      <!-- Extended hand palm -->
      <ellipse cx="-80" cy="100" rx="40" ry="25" fill="#f5d8a0" transform="rotate(-30 -80 100)"/>
      <!-- Mehndi patterns on palm -->
      <g stroke="#5a3a1a" stroke-width="1.5" fill="none">
        <circle cx="-80" cy="100" r="8"/>
        <path d="M-90,90 Q-80,80 -70,90 M-90,110 Q-80,120 -70,110"/>
        <path d="M-100,100 L-60,100 M-80,80 L-80,120"/>
      </g>
    </g>
  </g>
  <!-- Floor petals -->
  <g fill="#f0a020" opacity="0.6">
    <ellipse cx="200" cy="1900" rx="10" ry="18" transform="rotate(20 200 1900)"/>
    <ellipse cx="1400" cy="1900" rx="10" ry="18" transform="rotate(-20 1400 1900)"/>
  </g>
</svg>
