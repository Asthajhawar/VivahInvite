<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fbe9ea"/>
      <stop offset="1" stop-color="#f5d8da"/>
    </radialGradient>
    <linearGradient id="dhoti" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7a3a"/>
      <stop offset="1" stop-color="#1f5e1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d080"/>
      <stop offset="1" stop-color="#b89020"/>
    </linearGradient>
    <radialGradient id="lotus" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0f5"/>
      <stop offset="0.7" stop-color="#f0a0c0"/>
      <stop offset="1" stop-color="#d06090"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <!-- Corner floral borders -->
  <g fill="#e8a0b8" opacity="0.7">
    <path d="M0,0 Q200,0 300,100 Q200,200 0,150 Z"/>
    <path d="M1080,0 Q880,0 780,100 Q880,200 1080,150 Z"/>
    <path d="M0,1920 Q200,1920 300,1820 Q200,1720 0,1770 Z"/>
    <path d="M1080,1920 Q880,1920 780,1820 Q880,1720 1080,1770 Z"/>
  </g>
  <g stroke="#7a9a6a" stroke-width="3" fill="none" opacity="0.6">
    <path d="M40,40 Q200,80 280,160"/><path d="M1040,40 Q880,80 800,160"/>
    <path d="M40,1880 Q200,1840 280,1760"/><path d="M1040,1880 Q880,1840 800,1760"/>
  </g>
  <!-- Lotus seat -->
  <g transform="translate(540,1500)">
    <ellipse cx="0" cy="80" rx="240" ry="40" fill="#5a8a5a" opacity="0.5"/>
    <g fill="url(#lotus)">
      <ellipse cx="0" cy="40" rx="50" ry="100"/>
      <ellipse cx="-80" cy="50" rx="40" ry="80" transform="rotate(-30 -80 50)"/>
      <ellipse cx="80" cy="50" rx="40" ry="80" transform="rotate(30 80 50)"/>
      <ellipse cx="-140" cy="70" rx="35" ry="65" transform="rotate(-60 -140 70)"/>
      <ellipse cx="140" cy="70" rx="35" ry="65" transform="rotate(60 140 70)"/>
      <ellipse cx="-200" cy="90" rx="30" ry="55" transform="rotate(-80 -200 90)"/>
      <ellipse cx="200" cy="90" rx="30" ry="55" transform="rotate(80 200 90)"/>
    </g>
    <circle cx="0" cy="40" r="30" fill="#d4af37"/>
  </g>
  <!-- Ganesh body -->
  <g transform="translate(540,900)">
    <!-- Lower body / dhoti -->
    <path d="M-160,200 Q-180,400 -100,500 L100,500 Q180,400 160,200 Z" fill="url(#dhoti)" stroke="#d4af37" stroke-width="3"/>
    <!-- Belly -->
    <ellipse cx="0" cy="180" rx="140" ry="160" fill="#f5d8a0" stroke="#d4af37" stroke-width="2"/>
    <!-- Chest -->
    <path d="M-120,0 Q-100,-80 0,-100 Q100,-80 120,0 L100,120 L-100,120 Z" fill="#f5d8a0" stroke="#d4af37" stroke-width="2"/>
    <!-- Four arms -->
    <g fill="#f5d8a0" stroke="#d4af37" stroke-width="2">
      <path d="M-120,-40 Q-220,-20 -240,40 Q-200,60 -160,20 Z"/>
      <path d="M-100,40 Q-200,80 -220,160 Q-180,180 -120,120 Z"/>
      <path d="M120,-40 Q220,-20 240,40 Q200,60 160,20 Z"/>
      <path d="M100,40 Q200,80 220,160 Q180,180 120,120 Z"/>
    </g>
    <!-- Hands holding modak etc -->
    <circle cx="-220" cy="50" r="18" fill="#f5d8a0" stroke="#d4af37"/>
    <circle cx="220" cy="50" r="18" fill="#f5d8a0" stroke="#d4af37"/>
    <!-- Necklaces -->
    <g fill="none" stroke="url(#gold)" stroke-width="4">
      <path d="M-60,-40 Q0,-20 60,-40"/>
      <path d="M-80,0 Q0,30 80,0"/>
      <path d="M-100,40 Q0,80 100,40"/>
    </g>
    <g fill="#d4af37">
      <circle cx="0" cy="-30" r="8"/><circle cx="0" cy="20" r="8"/><circle cx="0" cy="60" r="8"/>
    </g>
    <!-- Head -->
    <ellipse cx="0" cy="-180" rx="110" ry="100" fill="#f5d8a0" stroke="#d4af37" stroke-width="2"/>
    <!-- Ears (elephant) -->
    <path d="M-100,-200 Q-180,-160 -160,-80 Q-120,-120 -100,-200 Z" fill="#f5d8a0" stroke="#d4af37" stroke-width="2"/>
    <path d="M100,-200 Q180,-160 160,-80 Q120,-120 100,-200 Z" fill="#f5d8a0" stroke="#d4af37" stroke-width="2"/>
    <!-- Crown -->
    <path d="M-90,-260 L-60,-320 L-30,-270 L0,-330 L30,-270 L60,-320 L90,-260 Z" fill="url(#gold)" stroke="#b89020" stroke-width="2"/>
    <circle cx="0" cy="-310" r="10" fill="#0b3d91"/>
    <circle cx="-60" cy="-300" r="8" fill="#800020"/>
    <circle cx="60" cy="-300" r="8" fill="#800020"/>
    <!-- Peacock feather in crown -->
    <path d="M0,-330 Q-10,-380 0,-400 Q10,-380 0,-330" fill="#0b6b3d" stroke="#d4af37"/>
    <ellipse cx="0" cy="-400" rx="14" ry="22" fill="#0b3d91" stroke="#d4af37"/>
    <circle cx="0" cy="-400" r="8" fill="#d4af37"/>
    <!-- Trunk -->
    <path d="M0,-150 Q-20,-100 -40,-80 Q-50,-60 -30,-50 Q-10,-60 0,-80 Q10,-60 20,-50 Q40,-60 30,-80 Q20,-100 0,-150 Z" fill="#f5d8a0" stroke="#d4af37" stroke-width="2"/>
    <!-- Eyes -->
    <ellipse cx="-30" cy="-200" rx="8" ry="5" fill="#000"/>
    <ellipse cx="30" cy="-200" rx="8" ry="5" fill="#000"/>
    <!-- Tilak -->
    <path d="M0,-260 Q-5,-240 0,-230 Q5,-240 0,-260" fill="#800020"/>
  </g>
</svg>
