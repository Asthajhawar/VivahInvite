<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="face" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#1a1a3a"/>
      <stop offset="1" stop-color="#0a0a1f"/>
    </radialGradient>
    <linearGradient id="saffron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a040"/>
      <stop offset="1" stop-color="#c97020"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a8a"/>
      <stop offset="1" stop-color="#0a1a5a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d080"/>
      <stop offset="1" stop-color="#b89020"/>
    </linearGradient>
  </defs>
  <g transform="translate(540,800)">
    <!-- Lower garment (blue) -->
    <path d="M-140,200 Q-180,500 -100,640 L100,640 Q180,500 140,200 Z" fill="url(#blue)" stroke="#d4af37" stroke-width="3"/>
    <!-- Upper garment (saffron dupatta) -->
    <path d="M-160,-40 Q-220,200 -180,400 M160,-40 Q220,200 180,400" fill="none" stroke="url(#saffron)" stroke-width="20"/>
    <!-- Body -->
    <ellipse cx="0" cy="120" rx="130" ry="180" fill="url(#face)"/>
    <!-- Face -->
    <ellipse cx="0" cy="-40" rx="100" ry="120" fill="url(#face)"/>
    <!-- Left arm raised palm-out -->
    <path d="M-120,0 Q-220,-80 -240,-200 Q-200,-220 -160,-120 Q-130,-40 -120,0 Z" fill="url(#face)" stroke="#d4af37" stroke-width="2"/>
    <ellipse cx="-230" cy="-210" rx="30" ry="35" fill="url(#face)" stroke="#d4af37" stroke-width="2"/>
    <!-- Right arm bent down -->
    <path d="M120,0 Q200,80 220,200 Q180,220 140,140 Q120,60 120,0 Z" fill="url(#face)" stroke="#d4af37" stroke-width="2"/>
    <ellipse cx="215" cy="210" rx="28" ry="32" fill="url(#face)" stroke="#d4af37" stroke-width="2"/>
    <!-- Mukut (crown) -->
    <path d="M-100,-160 L-70,-240 L-30,-180 L0,-260 L30,-180 L70,-240 L100,-160 Z" fill="url(#gold)" stroke="#b89020" stroke-width="2"/>
    <circle cx="0" cy="-240" r="14" fill="#0b6b3d"/>
    <circle cx="0" cy="-240" r="8" fill="#800020"/>
    <circle cx="-60" cy="-220" r="10" fill="#0b3d91"/>
    <circle cx="60" cy="-220" r="10" fill="#0b3d91"/>
    <!-- Peacock feather -->
    <path d="M0,-260 Q-15,-330 0,-360 Q15,-330 0,-260" fill="#0b6b3d" stroke="#d4af37"/>
    <ellipse cx="0" cy="-360" rx="16" ry="26" fill="#0b3d91" stroke="#d4af37"/>
    <circle cx="0" cy="-360" r="10" fill="#d4af37"/>
    <!-- Lotus eyes -->
    <ellipse cx="-30" cy="-60" rx="14" ry="8" fill="#fff"/>
    <ellipse cx="30" cy="-60" rx="14" ry="8" fill="#fff"/>
    <ellipse cx="-30" cy="-60" rx="6" ry="5" fill="#000"/>
    <ellipse cx="30" cy="-60" rx="6" ry="5" fill="#000"/>
    <!-- Smile -->
    <path d="M-20,-10 Q0,5 20,-10" stroke="#d4af37" stroke-width="2" fill="none"/>
    <!-- Tilak (Vaishnav U) -->
    <path d="M-10,-150 L-5,-100 L0,-150 L5,-100 L10,-150" stroke="#d4af37" stroke-width="3" fill="none"/>
    <circle cx="0" cy="-120" r="6" fill="#800020"/>
    <!-- Necklaces -->
    <g fill="none" stroke="url(#gold)" stroke-width="4">
      <path d="M-70,-20 Q0,0 70,-20"/>
      <path d="M-90,30 Q0,60 90,30"/>
      <path d="M-110,80 Q0,120 110,80"/>
    </g>
    <!-- Pearl malas -->
    <g fill="#fff8ed" stroke="#d4af37" stroke-width="1">
      <circle cx="-60" cy="0" r="4"/><circle cx="-40" cy="5" r="4"/><circle cx="-20" cy="8" r="4"/>
      <circle cx="0" cy="10" r="4"/><circle cx="20" cy="8" r="4"/><circle cx="40" cy="5" r="4"/><circle cx="60" cy="0" r="4"/>
    </g>
    <!-- Garlands -->
    <g fill="#f0a0c0">
      <ellipse cx="-80" cy="120" rx="8" ry="14"/><ellipse cx="-50" cy="140" rx="8" ry="14"/>
      <ellipse cx="-20" cy="150" rx="8" ry="14"/><ellipse cx="20" cy="150" rx="8" ry="14"/>
      <ellipse cx="50" cy="140" rx="8" ry="14"/><ellipse cx="80" cy="120" rx="8" ry="14"/>
    </g>
  </g>
</svg>
