<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="paper" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="1" stop-color="#f0e0c0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#paper)"/>
  <!-- Mughal lattice upper -->
  <g stroke="#c9a24b" stroke-width="1" fill="none" opacity="0.25">
    <g transform="translate(540,300)">
      <circle r="40"/><circle r="60"/><circle r="80"/>
      <circle cx="-80" r="40"/><circle cx="80" r="40"/>
      <circle cx="-160" r="40"/><circle cx="160" r="40"/>
      <circle cx="-240" r="40"/><circle cx="240" r="40"/>
    </g>
  </g>
  <!-- Faded mandala medallion -->
  <g transform="translate(540,1200)" stroke="#c9a24b" stroke-width="2" fill="none" opacity="0.1">
    <circle r="200"/><circle r="160"/><circle r="120"/>
    <g><line x1="0" y1="-200" x2="0" y2="200"/><line x1="-200" y1="0" x2="200" y2="0"/>
    <line x1="-140" y1="-140" x2="140" y2="140"/><line x1="140" y1="-140" x2="-140" y2="140"/></g>
  </g>
  <!-- Cherry blossom branches -->
  <g fill="#f0c0d0" opacity="0.4">
    <circle cx="80" cy="900" r="14"/><circle cx="120" cy="940" r="10"/><circle cx="60" cy="980" r="12"/>
    <circle cx="1000" cy="900" r="14"/><circle cx="960" cy="940" r="10"/><circle cx="1020" cy="980" r="12"/>
  </g>
  <g stroke="#8b6f47" stroke-width="3" fill="none" opacity="0.4">
    <path d="M0,950 Q80,920 160,960"/><path d="M1080,950 Q1000,920 920,960"/>
  </g>
  <!-- Gold paint splashes lower -->
  <g fill="#d4af37" opacity="0.15">
    <ellipse cx="120" cy="1700" rx="80" ry="30"/><ellipse cx="960" cy="1700" rx="80" ry="30"/>
  </g>
</svg>
