<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b6b6b"/>
      <stop offset="0.5" stop-color="#0b3d91"/>
      <stop offset="1" stop-color="#1a3a6a"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6b3d"/>
      <stop offset="0.5" stop-color="#0b3d91"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <g transform="translate(540,1300)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="120" ry="200" fill="url(#body)"/>
    <!-- Neck -->
    <path d="M-40,-180 Q-30,-280 0,-300 Q30,-280 40,-180 Z" fill="url(#body)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-320" rx="50" ry="40" fill="url(#body)"/>
    <!-- Beak -->
    <path d="M40,-320 Q80,-310 70,-290 Q50,-300 40,-310 Z" fill="#d4af37"/>
    <!-- Eye -->
    <circle cx="20" cy="-330" r="6" fill="#fff"/>
    <circle cx="20" cy="-330" r="3" fill="#000"/>
    <!-- Crest -->
    <path d="M-10,-360 Q0,-400 10,-360" stroke="#d4af37" stroke-width="3" fill="none"/>
    <!-- Tail (fanned right) -->
    <g transform="translate(100,-50)">
      <ellipse cx="0" cy="0" rx="200" ry="80" fill="url(#tail)" opacity="0.9"/>
      <g fill="#0b3d91" opacity="0.8">
        <ellipse cx="80" cy="-20" rx="30" ry="40"/><ellipse cx="120" cy="0" rx="30" ry="40"/>
        <ellipse cx="160" cy="20" rx="30" ry="40"/><ellipse cx="40" cy="-40" rx="30" ry="40"/>
      </g>
      <g fill="#d4af37">
        <circle cx="80" cy="-20" r="14"/><circle cx="120" cy="0" r="14"/>
        <circle cx="160" cy="20" r="14"/><circle cx="40" cy="-40" r="14"/>
      </g>
      <g fill="#0b3d91">
        <circle cx="80" cy="-20" r="8"/><circle cx="120" cy="0" r="8"/>
        <circle cx="160" cy="20" r="8"/><circle cx="40" cy="-40" r="8"/>
      </g>
    </g>
    <!-- Legs -->
    <line x1="-30" y1="180" x2="-30" y2="260" stroke="#d4af37" stroke-width="6"/>
    <line x1="30" y1="180" x2="30" y2="260" stroke="#d4af37" stroke-width="6"/>
  </g>
</svg>
