<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d0a8"/>
      <stop offset="1" stop-color="#c9a96b"/>
    </linearGradient>
  </defs>
  <!-- Sand-colored hills -->
  <path d="M0,1400 Q540,1200 1080,1400 L1080,1920 L0,1920 Z" fill="url(#sand)"/>
  <path d="M0,1500 Q300,1380 600,1480 Q800,1420 1080,1500 L1080,1920 L0,1920 Z" fill="#b89060" opacity="0.6"/>
  <!-- Marble railing -->
  <g transform="translate(540,1450)">
    <rect x="-400" y="0" width="800" height="20" fill="#fff8ed" stroke="#c9a24b" stroke-width="2"/>
    <g fill="#fff8ed" stroke="#c9a24b" stroke-width="1.5">
      <rect x="-380" y="-40" width="14" height="40"/>
      <rect x="-300" y="-40" width="14" height="40"/>
      <rect x="-220" y="-40" width="14" height="40"/>
      <rect x="-140" y="-40" width="14" height="40"/>
      <rect x="-60" y="-40" width="14" height="40"/>
      <rect x="20" y="-40" width="14" height="40"/>
      <rect x="100" y="-40" width="14" height="40"/>
      <rect x="180" y="-40" width="14" height="40"/>
      <rect x="260" y="-40" width="14" height="40"/>
      <rect x="340" y="-40" width="14" height="40"/>
    </g>
  </g>
  <!-- Two floral urns -->
  <g transform="translate(180,1480)">
    <path d="M-30,0 L30,0 L20,80 L-20,80 Z" fill="#d4af37" stroke="#b89020"/>
    <g fill="#e8a0b8">
      <circle cx="0" cy="-30" r="20"/><circle cx="-20" cy="-20" r="16"/><circle cx="20" cy="-20" r="16"/>
    </g>
    <g fill="#7a9a6a">
      <ellipse cx="-30" cy="-10" rx="14" ry="6" transform="rotate(-30 -30 -10)"/>
      <ellipse cx="30" cy="-10" rx="14" ry="6" transform="rotate(30 30 -10)"/>
    </g>
  </g>
  <g transform="translate(900,1480)">
    <path d="M-30,0 L30,0 L20,80 L-20,80 Z" fill="#d4af37" stroke="#b89020"/>
    <g fill="#e8a0b8">
      <circle cx="0" cy="-30" r="20"/><circle cx="-20" cy="-20" r="16"/><circle cx="20" cy="-20" r="16"/>
    </g>
    <g fill="#7a9a6a">
      <ellipse cx="-30" cy="-10" rx="14" ry="6" transform="rotate(-30 -30 -10)"/>
      <ellipse cx="30" cy="-10" rx="14" ry="6" transform="rotate(30 30 -10)"/>
    </g>
  </g>
</svg>
