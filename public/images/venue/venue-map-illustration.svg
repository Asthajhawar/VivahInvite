<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mapbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f0e0"/>
      <stop offset="1" stop-color="#c9d9b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#mapbg)"/>
  <!-- Water bodies -->
  <path d="M0,500 Q300,450 600,520 Q900,580 1200,500 L1200,900 L0,900 Z" fill="#a8c8d8" opacity="0.7"/>
  <!-- Roads -->
  <g stroke="#fff8ed" stroke-width="14" fill="none">
    <path d="M0,300 Q400,280 800,320 Q1000,330 1200,300"/>
    <path d="M600,0 Q620,400 580,900"/>
    <path d="M0,700 Q400,680 800,720 Q1000,730 1200,700"/>
  </g>
  <g stroke="#c9a24b" stroke-width="3" fill="none" stroke-dasharray="20,10">
    <path d="M0,300 Q400,280 800,320 Q1000,330 1200,300"/>
    <path d="M600,0 Q620,400 580,900"/>
    <path d="M0,700 Q400,680 800,720 Q1000,730 1200,700"/>
  </g>
  <!-- Blocks / parks -->
  <g fill="#9ab890" opacity="0.5">
    <rect x="100" y="100" width="120" height="100" rx="10"/>
    <rect x="800" y="150" width="140" height="120" rx="10"/>
    <rect x="200" y="500" width="100" height="80" rx="10"/>
    <rect x="900" y="600" width="120" height="100" rx="10"/>
  </g>
  <!-- Venue marker (center) -->
  <g transform="translate(600,450)">
    <circle r="40" fill="#800020" opacity="0.2"/>
    <path d="M0,-50 Q-30,-50 -30,-20 Q-30,10 0,30 Q30,10 30,-20 Q30,-50 0,-50 Z" fill="#800020" stroke="#d4af37" stroke-width="3"/>
    <circle cx="0" cy="-25" r="10" fill="#d4af37"/>
  </g>
  <!-- Compass -->
  <g transform="translate(1080,80)">
    <circle r="40" fill="#fff8ed" stroke="#c9a24b" stroke-width="2"/>
    <path d="M0,-30 L8,0 L0,30 L-8,0 Z" fill="#800020"/>
    <text x="0" y="-35" text-anchor="middle" font-family="serif" font-size="14" fill="#1b2a4a">N</text>
  </g>
  <!-- Title cartouche -->
  <g transform="translate(100,80)">
    <rect x="-10" y="-20" width="220" height="40" rx="6" fill="#fff8ed" stroke="#c9a24b" stroke-width="2"/>
    <text x="100" y="6" text-anchor="middle" font-family="serif" font-size="18" fill="#1b2a4a" font-style="italic">Venue Location</text>
  </g>
</svg>
