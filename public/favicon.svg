<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Warm cream background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8ed"/>
      <stop offset="100%" stop-color="#f5e6c8"/>
    </radialGradient>

    <!-- Gold ring gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#b8902a"/>
    </linearGradient>

    <!-- Crimson gradient for letters -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b1030"/>
      <stop offset="100%" stop-color="#800020"/>
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="letterShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.4" flood-color="#800020" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)"/>

  <!-- Outer gold border ring -->
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="url(#goldRing)" stroke-width="1.8"/>
  <!-- Inner decorative ring -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="2.5 2.5"/>

  <!-- 8 petal mandala ornament (small gold petals around center) -->
  <g transform="translate(32,32)" fill="#d4af37" opacity="0.55">
    <ellipse cx="0" cy="-21" rx="2.2" ry="3.5"/>
    <ellipse cx="0" cy="-21" rx="2.2" ry="3.5" transform="rotate(45)"/>
    <ellipse cx="0" cy="-21" rx="2.2" ry="3.5" transform="rotate(90)"/>
    <ellipse cx="0" cy="-21" rx="2.2" ry="3.5" transform="rotate(135)"/>
    <ellipse cx="0" cy="-21" rx="2.2" ry="3.5" transform="rotate(180)"/>
    <ellipse cx="0" cy="-21" rx="2.2" ry="3.5" transform="rotate(225)"/>
    <ellipse cx="0" cy="-21" rx="2.2" ry="3.5" transform="rotate(270)"/>
    <ellipse cx="0" cy="-21" rx="2.2" ry="3.5" transform="rotate(315)"/>
  </g>

  <!-- 4 corner diamond ornaments -->
  <g fill="#c9a24b" opacity="0.75">
    <polygon points="32,6 33.2,7.8 32,9.6 30.8,7.8" />
    <polygon points="32,54.4 33.2,56.2 32,58 30.8,56.2" />
    <polygon points="6,32 7.8,33.2 9.6,32 7.8,30.8" />
    <polygon points="54.4,32 56.2,33.2 58,32 56.2,30.8" />
  </g>

  <!-- Thin horizontal gold divider line between A and S -->
  <line x1="29" y1="32" x2="35" y2="32" stroke="#d4af37" stroke-width="0.7" opacity="0.8"/>

  <!-- Letter "A" — left side, elegant serif style -->
  <g filter="url(#letterShadow)">
    <!-- A: two angled strokes with crossbar -->
    <path d="M16.5,41.5 L22.5,20.5 L28.5,41.5" fill="none" stroke="url(#crimsonGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="18.8" y1="35" x2="26.2" y2="35" stroke="url(#crimsonGrad)" stroke-width="2.1" stroke-linecap="round"/>
    <!-- Tiny gold serif feet on A -->
    <line x1="15.2" y1="41.5" x2="17.8" y2="41.5" stroke="#c9a24b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="27.2" y1="41.5" x2="29.8" y2="41.5" stroke="#c9a24b" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Letter "S" — right side, elegant serif style -->
  <g filter="url(#letterShadow)">
    <!-- S top arc -->
    <path d="M43.5,24.5 Q43.5,20.5 38.5,20.5 Q34,20.5 34,25 Q34,29 38.5,31 Q43.5,33 43.5,37.5 Q43.5,42.5 38,42.5 Q33,42.5 33,38" fill="none" stroke="url(#crimsonGrad)" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Gold tips on S -->
    <circle cx="43.5" cy="24.5" r="1" fill="#c9a24b"/>
    <circle cx="33" cy="38" r="1" fill="#c9a24b"/>
  </g>

  <!-- Central "&" ampersand connector — tiny gold knot -->
  <g transform="translate(31.5,32)" fill="none" stroke="#d4af37" stroke-width="0.9" stroke-linecap="round">
    <path d="M-0.8,-1.8 Q-2,-1.8 -2,-0.6 Q-2,0.6 0,1 Q2,1.4 2,2.8 Q2,4.2 0,4.2 Q-1.5,4.2 -1.5,3.2" opacity="0.95"/>
  </g>
</svg>
